[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weldcheck"
version = "0.1.0"
description = "Fillet weld design checks to EN 1993-1-8 with a Qt6 (PySide6) interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5"]

[tool.setuptools.packages.find]
include = ["weldcheck*"]
